name: Build and model integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Verify original model artifacts
        run: python3 scripts/verify_models.py
      - name: Build simulator Release
        env:
          ADAS_BUILD_ROOT: ${{ runner.temp }}/ADASDerivedData
        run: bash scripts/build.sh simulator
